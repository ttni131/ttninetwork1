<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ttninetwork | Duo</title>
    <style>
        /* Kar efekti kaldırıldı, tam ekran video odaklı tasarım */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #000; 
            overflow: hidden; 
            font-family: 'Segoe UI', sans-serif; 
        }

        /* Arka Plan Live Video (mp4) */
        #bg-video { 
            position: fixed; 
            right: 0; 
            bottom: 0; 
            min-width: 100%; 
            min-height: 100%; 
            z-index: -1; 
            object-fit: cover; 
            filter: brightness(0.4); /* İçeriğin görünmesi için hafif karartma */
        }

        /* Giriş Ekranı (Müzik çalması için şart) */
        #overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #000; 
            z-index: 1000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            transition: opacity 0.8s ease; 
        }
        
        #overlay h2 { 
            color: #a29bfe; 
            border: 2px solid #a29bfe; 
            padding: 20px 40px; 
            border-radius: 5px; 
            text-transform: uppercase; 
            letter-spacing: 5px;
            box-shadow: 0 0 20px rgba(162, 155, 254, 0.4);
        }

        /* Ana İçerik */
        .content { 
            position: relative; 
            z-index: 2; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            opacity: 0; 
            transition: opacity 1.2s ease; 
        }

        .box { 
            background: rgba(0, 0, 0, 0.6); 
            padding: 60px; 
            border-radius: 20px; 
            border: 1px solid rgba(162, 155, 254, 0.5); 
            text-align: center; 
            backdrop-filter: blur(10px); 
        }

        h1 { 
            font-size: 4rem; 
            margin: 0; 
            color: #a29bfe; 
            text-shadow: 0 0 20px #6c5ce7; 
            letter-spacing: 2px;
        }

        .info-btn { 
            margin-top: 30px; 
            background: transparent; 
            border: 2px solid #a29bfe; 
            color: #a29bfe; 
            padding: 15px 40px; 
            font-size: 1.1rem; 
            cursor: pointer; 
            border-radius: 50px; 
            transition: 0.3s; 
            font-weight: bold;
        }

        .info-btn:hover { 
            background: #a29bfe; 
            color: #000; 
            box-shadow: 0 0 25px #a29bfe; 
        }

        /* Bilgi Penceresi (Modal) */
        .modal { 
            display: none; 
            position: fixed; 
            z-index: 1001; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.92); 
            backdrop-filter: blur(8px); 
        }

        .m-content { 
            background: #0a0a0a; 
            margin: 15% auto; 
            padding: 40px; 
            border: 1px solid #a29bfe; 
            width: 450px; 
            border-radius: 15px; 
            color: #fff; 
            display: flex; 
            justify-content: space-around; 
            animation: fadeIn 0.4s ease;
        }

        .card h3 { color: #a29bfe; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .card p { font-size: 0.9rem; margin: 10px 0; }
        .card span { color: #a29bfe; font-weight: bold; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="video.mp4" type="video/mp4">
    </video>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div id="overlay" onclick="startSession()">
        <h2>CLICK TO ENTER</h2>
    </div>

    <div class="content" id="mainLayout">
        <div class="box">
            <h1>ttninetwork</h1>
            <button class="info-btn" onclick="toggleModal(true)">ttnibilgi</button>
        </div>
    </div>

    <div id="infoModal" class="modal" onclick="toggleModal(false)">
        <div class="m-content" onclick="event.stopPropagation()">
            <div class="card">
                <h3>ttni</h3>
                <p>Ad: <span>Mete</span></p>
                <p>Yaş: <span>13</span></p>
            </div>
            <div style="width: 1px; background: #333; margin: 0 10px;"></div>
            <div class="card">
                <h3>konacore</h3>
                <p>Ad: <span>Uras</span></p>
                <p>Yaş: <span>12</span></p>
            </div>
        </div>
    </div>

    <script>
        function startSession() {
            // Müzik çal
            const audio = document.getElementById("bgMusic");
            audio.volume = 0.6;
            audio.play().catch(err => console.log("Müzik yüklenemedi: ", err));

            // Videoyu kontrol et (Bazı tarayıcılar etkileşimden sonra başlatır)
            const video = document.getElementById("bg-video");
            video.play();

            // Giriş ekranını kaldır
            const overlay = document.getElementById("overlay");
            overlay.style.opacity = "0";
            
            setTimeout(() => {
                overlay.style.display = "none";
                document.getElementById("mainLayout").style.opacity = "1";
            }, 800);
        }

        function toggleModal(show) {
            document.getElementById('infoModal').style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
