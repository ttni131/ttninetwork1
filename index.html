<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTNI Network | Minecraft Sunucusu</title>
    <style>
        :root { --main-color: #ff9d00; --bg-dark: #0f0f0f; --card-bg: #1a1a1a; }
        body { background: var(--bg-dark); color: white; font-family: sans-serif; margin: 0; user-select: none; }
        
        /* Navigasyon */
        nav { background: #000; padding: 20px; border-bottom: 2px solid var(--main-color); text-align: center; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--main-color); }

        /* Kartlar ve Tasarım */
        .container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; padding: 50px; }
        .rank-card { background: var(--card-bg); border-radius: 12px; width: 250px; padding: 20px; border: 1px solid #333; text-align: center; }
        
        /* Ödeme Modalı (Gizli Ekran) */
        #paymentModal {
            display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9); justify-content: center; align-items: center;
        }
        .modal-content { background: #222; padding: 30px; border-radius: 10px; border: 1px solid var(--main-color); width: 350px; }
        
        form { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        input { padding: 12px; border-radius: 5px; border: 1px solid #444; background: #000; color: white; }
        .btn { background: var(--main-color); color: black; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body oncontextmenu="return false;"> <nav><div class="logo">TTNI NETWORK</div></nav>

<div class="container">
    <div class="rank-card">
        <h2 style="color: #55ff55;">VIP</h2>
        <p>50 TL</p>
        <button class="btn" onclick="openPayment('VIP', '50')">SATIN AL</button>
    </div>
    <div class="rank-card">
        <h2 style="color: #55ffff;">MVP+</h2>
        <p>120 TL</p>
        <button class="btn" onclick="openPayment('MVP+', '120')">SATIN AL</button>
    </div>
</div>

<div style="text-align: center; padding: 50px; background: #111;">
    <h2>KAYIT VE GİRİŞ SİSTEMİ</h2>
    <form id="regForm" style="max-width:300px; margin:0 auto;">
        <input type="text" id="user" placeholder="Kullanıcı Adı" required>
        <input type="password" id="pass" placeholder="Şifre" required>
        <button type="submit" class="btn">VERİTABANINA KAYDET</button>
    </form>
</div>

<div id="paymentModal">
    <div class="modal-content">
        <h2 id="productName" style="color:var(--main-color)">Ödeme</h2>
        <p id="productPrice"></p>
        <form id="payForm">
            <input type="text" placeholder="Kart Üzerindeki İsim" required>
            <input type="text" placeholder="Kart Numarası (16 Hane)" maxlength="16" required>
            <div style="display:flex; gap:5px;">
                <input type="text" placeholder="AA/YY" style="width:50%" required>
                <input type="text" placeholder="CVV" style="width:50%" required>
            </div>
            <button type="button" class="btn" onclick="completePayment()">ÖDEMEYİ TAMAMLA</button>
            <button type="button" style="background:red; color:white; border:none; padding:5px; margin-top:5px; cursor:pointer;" onclick="closePayment()">İPTAL</button>
        </form>
    </div>
</div>

<script>
    // F12 VE İNCELE ENGELLEME
    document.onkeydown = function(e) {
        if(event.keyCode == 123) return false; // F12
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; // Ctrl+Shift+I
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; // Ctrl+Shift+J
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ctrl+U
    };

    // ÖDEME FONKSİYONLARI
    function openPayment(name, price) {
        document.getElementById('productName').innerText = name + " Satın Al";
        document.getElementById('productPrice').innerText = "Tutar: " + price + " TL";
        document.getElementById('paymentModal').style.display = 'flex';
    }

    function closePayment() {
        document.getElementById('paymentModal').style.display = 'none';
    }

    function completePayment() {
        alert("Ödeme Bilgileri Veritabanına Gönderildi! (Simülasyon)");
        closePayment();
    }

    // KAYIT SİSTEMİ (Express/Node.js backend'e gönderir)
    document.getElementById('regForm').onsubmit = async (e) => {
        e.preventDefault();
        const userData = {
            user: document.getElementById('user').value,
            pass: document.getElementById('pass').value
        };
        console.log("Database'e gidiyor:", userData);
        alert("Kullanıcı Kaydedildi: " + userData.user);
    };
</script>

</body>
</html>
