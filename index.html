<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ttninetwork | Official</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Arial', sans-serif; }
        canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 1000; display: flex;
            justify-content: center; align-items: center; cursor: pointer;
            transition: opacity 0.8s ease;
        }
        #overlay h2 { color: #a29bfe; border: 2px solid #a29bfe; padding: 20px 40px; border-radius: 10px; text-transform: uppercase; letter-spacing: 5px; animation: pulse 1.5s infinite; }
        .content { position: relative; z-index: 2; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: opacity 1s ease; }
        .box { background: rgba(15, 15, 15, 0.85); padding: 60px; border-radius: 40px; border: 3px solid #a29bfe; text-align: center; box-shadow: 0 0 30px rgba(162, 155, 254, 0.4); backdrop-filter: blur(10px); }
        h1 { font-size: 4rem; margin: 0; color: #a29bfe; text-shadow: 0 0 20px #6c5ce7; }
        .info-btn { margin-top: 30px; background: transparent; border: 2px solid #a29bfe; color: #a29bfe; padding: 15px 40px; font-size: 1.2rem; cursor: pointer; font-weight: bold; border-radius: 50px; transition: 0.3s; }
        .info-btn:hover { background: #a29bfe; color: #000; box-shadow: 0 0 25px #a29bfe; }
        .modal { display: none; position: fixed; z-index: 1001; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
        .m-content { background: #1a1a1a; margin: 15% auto; padding: 40px; border: 2px solid #a29bfe; width: 300px; border-radius: 20px; color: #fff; line-height: 1.8; }
        .m-content span { color: #a29bfe; font-weight: bold; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="MAMA MA (ULTRA SLOWED REVERB).mp3" type="audio/mpeg">
    </audio>

    <div id="overlay" onclick="startEverything()">
        <h2>CLICK TO ENTER</h2>
    </div>

    <canvas id="snow"></canvas>

    <div class="content" id="mainContent">
        <div class="box">
            <h1>ttninetwork</h1>
            <button class="info-btn" onclick="openModal()">ttnibilgi</button>
        </div>
    </div>

    <div id="infoModal" class="modal" onclick="this.style.display='none'">
        <div class="m-content">
            <h3>User: ttni</h3>
            <div>Ad: <span>Mete (ttni)</span></div>
            <div>Yaş: <span>13</span></div>
            <div>Best Duo: <span>konacore</span></div>
        </div>
    </div>

    <script>
        const music = document.getElementById("bgMusic");
        const overlay = document.getElementById("overlay");
        const content = document.getElementById("mainContent");

        function startEverything() {
            music.play().catch(e => console.log("Dosya bulunamadı: İsimleri kontrol et."));
            overlay.style.opacity = "0";
            setTimeout(() => {
                overlay.style.display = "none";
                content.style.opacity = "1";
            }, 800);
        }

        function openModal() { document.getElementById('infoModal').style.display='block'; }

        const c = document.getElementById('snow'), ctx = c.getContext('2d');
        let w, h, f = [];
        function init() { 
            w = window.innerWidth; h = window.innerHeight; c.width = w; c.height = h;
            f = []; for(let i=0; i<150; i++) f.push({x:Math.random()*w, y:Math.random()*h, r:Math.random()*3+1, d:Math.random()*0.8+0.5});
        }
        function draw() {
            ctx.clearRect(0,0,w,h); ctx.fillStyle='#fff'; ctx.beginPath();
            f.forEach(p => { ctx.moveTo(p.x, p.y); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); });
            ctx.fill(); update(); requestAnimationFrame(draw);
        }
        function update() {
            f.forEach(p => { p.y += p.d; if(p.y > h) p.y = 0; p.x += Math.sin(p.y/30) * 0.5; });
        }
        window.onresize = init; init(); draw();
    </script>
</body>
</html>
