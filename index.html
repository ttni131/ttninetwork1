<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ttninetwork | Neon Duo</title>
    <style>
        /* Neon Yeşil Tema Ayarları */
        :root { --neon-green: #39ff14; --dark-bg: rgba(0, 0, 0, 0.8); }
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; color: white; }

        /* Arka Plan Live Video */
        #bg-video { 
            position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; 
            z-index: -1; object-fit: cover; filter: brightness(0.4) saturate(1.5); 
        }

        /* Giriş Ekranı */
        #overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 2000; display: flex; justify-content: center; 
            align-items: center; cursor: pointer; transition: 0.8s; 
        }
        #overlay h2 { 
            color: var(--neon-green); border: 2px solid var(--neon-green); padding: 20px 40px; 
            letter-spacing: 5px; box-shadow: 0 0 20px var(--neon-green), inset 0 0 10px var(--neon-green); 
            text-transform: uppercase;
        }

        /* Ana İçerik */
        .main-container { 
            position: relative; z-index: 2; height: 100vh; display: flex; 
            flex-direction: column; justify-content: center; align-items: center; 
            opacity: 0; transition: 1s; 
        }

        .box {
            background: rgba(0, 0, 0, 0.7); padding: 50px; border-radius: 15px;
            border: 2px solid var(--neon-green); text-align: center;
            backdrop-filter: blur(10px); box-shadow: 0 0 30px rgba(57, 255, 20, 0.2);
        }

        h1 { font-size: 4rem; color: var(--neon-green); text-shadow: 0 0 20px var(--neon-green); margin: 0; }
        
        /* Bilgi Butonu */
        .info-btn {
            margin-top: 30px; background: transparent; border: 2px solid var(--neon-green);
            color: var(--neon-green); padding: 12px 30px; cursor: pointer; font-weight: bold;
            text-transform: uppercase; transition: 0.3s;
        }
        .info-btn:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 20px var(--neon-green); }

        /* Bilgi Yazısı (Modal) */
        .modal { 
            display: none; position: fixed; z-index: 3000; left: 0; top: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.9); 
            backdrop-filter: blur(15px);
        }
        .m-content { 
            background: #000; margin: 15% auto; padding: 40px; 
            border: 2px solid var(--neon-green); width: 400px; border-radius: 10px; 
            color: var(--neon-green); text-align: center; box-shadow: 0 0 40px var(--neon-green);
        }
        .m-content h3 { border-bottom: 1px solid var(--neon-green); padding-bottom: 10px; }
        .m-content p { font-size: 1.2rem; margin: 15px 0; }
        .m-content span { color: #fff; text-shadow: 0 0 5px var(--neon-green); }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="video.mp4" type="video/mp4">
    </video>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div id="overlay" onclick="start()">
        <h2>SYSTEM START</h2>
    </div>

    <div class="main-container" id="mainUI">
        <div class="box">
            <h1>ttninetwork</h1>
            <button class="info-btn" onclick="openModal()">BİLGİ</button>
        </div>
    </div>

    <div id="infoModal" class="modal" onclick="closeModal()">
        <div class="m-content" onclick="event.stopPropagation()">
            <h3>DATABASE INFO</h3>
            <p>Admin: <span>Mete (ttni)</span></p>
            <p>Duo: <span>Uras (konacore)</span></p>
            <p>Status: <span>Online</span></p>
            <button class="info-btn" style="font-size: 0.8rem;" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

    <script>
        function start() {
            document.getElementById('bgMusic').play();
            document.getElementById('overlay').style.opacity = "0";
            setTimeout(() => {
                document.getElementById('overlay').style.display = "none";
                document.getElementById('mainUI').style.opacity = "1";
            }, 800);
        }

        function openModal() {
            document.getElementById('infoModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
        }
    </script>
</body>
</html>
