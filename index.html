<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ttninetwork | Duo</title>
    <style>
        :root { --main: #a29bfe; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Poppins', sans-serif; color: white; }

        /* Arka Plan Live Video */
        #bg-video { 
            position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; 
            z-index: -1; object-fit: cover; filter: brightness(0.35); 
        }

        /* Giriş Ekranı */
        #overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 2000; display: flex; justify-content: center; 
            align-items: center; cursor: pointer; transition: 0.8s; 
        }
        #overlay h2 { 
            color: var(--main); border: 2px solid var(--main); padding: 20px 40px; 
            letter-spacing: 5px; box-shadow: 0 0 25px var(--main); 
            text-transform: uppercase; animation: pulse 1.5s infinite;
        }

        /* Ana Panel */
        .main-container { 
            position: relative; z-index: 2; height: 100vh; display: flex; 
            flex-direction: column; justify-content: center; align-items: center; 
            opacity: 0; transition: 1.5s; 
        }

        .box {
            background: rgba(0, 0, 0, 0.6); padding: 60px; border-radius: 30px;
            border: 1px solid rgba(162, 155, 254, 0.3); text-align: center;
            backdrop-filter: blur(12px); box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        h1 { font-size: 4.5rem; color: var(--main); text-shadow: 0 0 30px #6c5ce7; margin: 0; letter-spacing: 3px; }
        
        .duo-info { margin-top: 20px; color: #fff; font-size: 1.2rem; opacity: 0.8; }
        .duo-info span { color: var(--main); font-weight: bold; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="video.mp4" type="video/mp4">
    </video>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div id="overlay" onclick="startSession()">
        <h2>CLICK TO ENTER THE NETWORK</h2>
    </div>

    <div class="main-container" id="mainUI">
        <div class="box">
            <h1>ttninetwork</h1>
            <div class="duo-info">
                METE & URAS <br>
                <span>THE BEST DUO</span>
            </div>
        </div>
    </div>

    <script>
        function startSession() {
            // Müzik çalmayı başlat
            const music = document.getElementById('bgMusic');
            music.volume = 0.7; // Ses seviyesi %70
            music.play().catch(e => console.log("Müzik dosyası 'music.mp3' bulunamadı!"));

            // Giriş ekranını karart ve kaldır
            const overlay = document.getElementById('overlay');
            overlay.style.opacity = "0";
            
            setTimeout(() => {
                overlay.style.display = "none";
                document.getElementById('mainUI').style.opacity = "1";
            }, 800);
        }
    </script>
</body>
</html>
