<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>SİBER VERİ MERKEZİ</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; display: flex; justify-content: center; padding: 20px; }
        .terminal { width: 100%; max-width: 700px; border: 2px solid #00ff41; padding: 20px; box-shadow: 0 0 20px #00ff41; }
        .input-group { display: flex; gap: 10px; margin: 20px 0; }
        input { flex: 1; background: #000; border: 1px solid #00ff41; color: #00ff41; padding: 12px; outline: none; }
        button { background: #00ff41; color: #000; border: none; padding: 0 20px; cursor: pointer; font-weight: bold; }
        .res-box { border: 1px solid #222; background: #050505; padding: 15px; display: none; }
        .line { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #111; }
        .key { color: #888; font-size: 13px; }
        .val { color: #fff; font-weight: bold; }
        .loading { color: yellow; text-align: center; margin: 10px 0; display: none; }
    </style>
</head>
<body>

<div class="terminal">
    <h2 style="text-align: center;">CENTRAL DATABASE ACCESS</h2>
    
    <div class="input-group">
        <input type="text" id="ip" placeholder="Hedef IP Giriniz...">
        <button onclick="sorgula()">VERİLERİ ÇEK</button>
    </div>

    <div id="loader" class="loading">SİSTEME SIZILIYOR...</div>

    <div id="res" class="res-box">
        <div class="line"><span class="key">HEDEF ADI:</span> <span id="r_ad" class="val"></span></div>
        <div class="line"><span class="key">HEDEF SOYADI:</span> <span id="r_soyad" class="val"></span></div>
        <div class="line"><span class="key">TC KİMLİK:</span> <span id="r_tc" class="val"></span></div>
        <div class="line"><span class="key">ANNE ADI:</span> <span id="r_anne" class="val"></span></div>
        <div class="line"><span class="key">BABA ADI:</span> <span id="r_baba" class="val"></span></div>
        <div class="line"><span class="key">LOKASYON:</span> <span id="r_loc" class="val"></span></div>
    </div>
</div>

<script>
    // --- BURASI SENİN GERÇEK VERİ TABANIN ---
    const veritabani = {
        "31.155.233.10": {
            ad: "Ahmet",
            soyad: "Yılmaz",
            tc: "19234857612",
            anne: "Ayşe",
            baba: "Ali",
            loc: "Gölköy / Türkiye"
        },
        "127.0.0.1": {
            ad: "Admin",
            soyad: "User",
            tc: "00000000000",
            anne: "Havva",
            baba: "Adem",
            loc: "Localhost"
        }
    };

    async function sorgula() {
        const ip = document.getElementById('ip').value;
        const loader = document.getElementById('loader');
        const box = document.getElementById('res');

        loader.style.display = "block";
        box.style.display = "none";

        setTimeout(() => {
            loader.style.display = "none";
            
            if(veritabani[ip]) {
                const kisi = veritabani[ip];
                document.getElementById('r_ad').innerText = kisi.ad;
                document.getElementById('r_soyad').innerText = kisi.soyad;
                document.getElementById('r_tc').innerText = kisi.tc;
                document.getElementById('r_anne').innerText = kisi.anne;
                document.getElementById('r_baba').innerText = kisi.baba;
                document.getElementById('r_loc').innerText = kisi.loc;
                box.style.display = "block";
            } else {
                alert("IP Veritabanında Kayıtlı Değil!");
            }
        }, 1500);
    }
</script>

</body>
</html>
