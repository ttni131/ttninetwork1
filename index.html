<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ttninetwork | Neon Duo</title>
    <style>
        :root { --neon: #39ff14; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; overflow: hidden; 
            font-family: 'Courier New', monospace; color: white; 
        }

        /* Arka Plan Live Video */
        #bg-video { 
            position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; 
            z-index: -1; object-fit: cover; filter: brightness(0.4) saturate(1.2); 
        }

        /* Giriş Ekranı */
        #overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 2000; display: flex; justify-content: center; 
            align-items: center; cursor: pointer; transition: 0.8s; 
        }
        #overlay h2 { 
            color: var(--neon); border: 3px solid var(--neon); padding: 20px 40px; 
            box-shadow: 0 0 20px var(--neon), inset 0 0 10px var(--neon); 
            text-transform: uppercase; letter-spacing: 5px;
        }

        /* Ana Panel */
        .main-container { 
            position: relative; z-index: 2; height: 100vh; 
            display: flex; flex-direction: column; justify-content: center; 
            align-items: center; opacity: 0; transition: 1s; 
        }

        .box {
            background: rgba(0, 0, 0, 0.8); padding: 50px; border-radius: 10px;
            border: 2px solid var(--neon); text-align: center;
            backdrop-filter: blur(8px); box-shadow: 0 0 30px rgba(57, 255, 20, 0.2);
        }

        h1 { 
            font-size: 4rem; color: var(--neon); 
            text-shadow: 0 0 15px var(--neon); margin: 0; 
        }
        
        /* Bilgi Butonu */
        .info-btn {
            margin-top: 30px; background: transparent; border: 2px solid var(--neon);
            color: var(--neon); padding: 12px 35px; cursor: pointer; 
            font-weight: bold; text-transform: uppercase; transition: 0.3s;
        }
        .info-btn:hover { 
            background: var(--neon); color: #000; 
            box-shadow: 0 0 25px var(--neon); 
        }

        /* Bilgi Modal (Açılan Pencere) */
        .modal { 
            display: none; position: fixed; z-index: 3000; 
            left: 0; top: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); backdrop-filter: blur(15px);
        }
        .m-content { 
            background: #000; margin: 15% auto; padding: 40px; 
            border: 2px solid var(--neon); width: 350px; border-radius: 10px; 
            color: var(--neon); text-align: center; box-shadow: 0 0 40px var(--neon);
        }
        .m-content h3 { border-bottom: 1px dotted var(--neon); padding-bottom: 10px; }
        .m-content p { font-size: 1.1rem; margin: 20px 0; color: #fff; }
        .m-content span { color: var(--neon); font-weight: bold; }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="video.mp4" type="video/mp4">
    </video>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div id="overlay" onclick="start()">
        <h2>SYSTEM INITIALIZE</h2>
    </div>

    <div class="main-container" id="mainUI">
        <div class="box">
            <h1>ttninetwork</h1>
            <button class="info-btn" onclick="openModal()">BİLGİ</button>
        </div>
    </div>

    <div id="infoModal" class="modal" onclick="closeModal()">
        <div class="m-content" onclick="event.stopPropagation()">
            <h3>USER_DATABASE</h3>
            <p>Admin: <span>Mete (ttni)</span></p>
            <p>Duo: <span>Uras (konacore)</span></p>
            <p>Status: <span style="color: #39ff14;">ONLINE</span></p>
            <button class="info-btn" style="font-size: 0.7rem;" onclick="closeModal()">GERİ DÖN</button>
        </div>
    </div>

    <script>
        function start() {
            // Müzik çal
            const music = document.getElementById('bgMusic');
            music.play().catch(e => console.log("Dosya ismi hatalı!"));

            // Ekranı değiştir
            document.getElementById('overlay').style.opacity = "0";
            setTimeout(() => {
                document.getElementById('overlay').style.display = "none";
                document.getElementById('mainUI').style.opacity = "1";
            }, 800);
        }

        function openModal() { document.getElementById('infoModal').style.display = 'block'; }
        function closeModal() { document.getElementById('infoModal').style.display = 'none'; }
    </script>
</body>
</html>
