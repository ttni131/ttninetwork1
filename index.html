<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ttninetwork | Duo</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        
        /* Senin istediğin Anime Arka Planı */
        #bg-video { 
            position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; 
            z-index: -1; object-fit: cover; filter: brightness(0.35); 
        }

        canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
        
        /* Giriş Ekranı */
        #overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 1000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer; transition: 0.8s; 
        }
        #overlay h2 { color: #a29bfe; border: 2px solid #a29bfe; padding: 15px 30px; letter-spacing: 3px; }

        .content { position: relative; z-index: 2; height: 100vh; display: flex; justify-content: center; align-items: center; opacity: 0; transition: 1s; }
        
        .box { 
            background: rgba(0, 0, 0, 0.7); padding: 50px; border-radius: 30px; 
            border: 2px solid #a29bfe; text-align: center; backdrop-filter: blur(15px);
            box-shadow: 0 0 30px rgba(162, 155, 254, 0.2);
        }

        h1 { font-size: 3.5rem; color: #a29bfe; text-shadow: 0 0 15px #6c5ce7; margin: 0; }
        
        button { 
            margin-top: 25px; background: transparent; border: 2px solid #a29bfe; 
            color: #a29bfe; padding: 12px 35px; cursor: pointer; border-radius: 50px; 
            font-weight: bold; font-size: 1rem; transition: 0.3s;
        }
        button:hover { background: #a29bfe; color: #000; box-shadow: 0 0 20px #a29bfe; }

        /* Bilgi Penceresi */
        .modal { display: none; position: fixed; z-index: 1001; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
        .m-content { background: #111; margin: 15% auto; padding: 40px; border: 2px solid #a29bfe; width: 450px; border-radius: 20px; color: #fff; display: flex; justify-content: space-around; animation: pop 0.3s ease; }
        .card h3 { color: #a29bfe; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .card span { color: #a29bfe; font-weight: bold; }

        @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="Anime girl eyes rose bloom 4k Live Wallpaper.mp4" type="video/mp4">
    </video>

    <audio id="bgMusic" loop>
        <source src="MAMA MA (ULTRA SLOWED REVERB).mp3" type="audio/mpeg">
    </audio>

    <div id="overlay" onclick="start()">
        <h2>CLICK TO ENTER THE NETWORK</h2>
        <p style="color: #666; margin-top: 10px;">(Müzik ve Video İçin Tıkla)</p>
    </div>

    <canvas id="snow"></canvas>

    <div class="content" id="main">
        <div class="box">
            <h1>ttninetwork</h1>
            <button onclick="document.getElementById('m').style.display='block'">ttnibilgi</button>
        </div>
    </div>

    <div id="m" class="modal" onclick="this.style.display='none'">
        <div class="m-content" onclick="event.stopPropagation()">
            <div class="card">
                <h3>ttni</h3>
                <p>Ad: <span>Mete</span></p>
                <p>Yaş: <span>13</span></p>
            </div>
            <div class="card" style="border-left: 1px solid #333; padding-left: 30px;">
                <h3>konacore</h3>
                <p>Ad: <span>Uras</span></p>
                <p>Yaş: <span>12</span></p>
            </div>
        </div>
    </div>

    <script>
        function start() {
            var audio = document.getElementById("bgMusic");
            // Müzik çalmayı dener, hata varsa konsola yazar
            audio.play().catch(e => console.log("Müzik dosyası yüklenemedi. İsim doğru mu?"));
            
            document.getElementById("overlay").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("overlay").style.display = "none";
                document.getElementById("main").style.opacity = "1";
            }, 800);
        }

        // Kar Yağışı Efekti
        const c = document.getElementById('snow'), ctx = c.getContext('2d');
        let w, h, f = [];
        function init() { 
            w = window.innerWidth; h = window.innerHeight; c.width = w; c.height = h;
            f = []; for(let i=0; i<100; i++) f.push({x:Math.random()*w, y:Math.random()*h, r:Math.random()*2+1, d:Math.random()*0.5+0.2});
        }
        function draw() {
            ctx.clearRect(0,0,w,h); ctx.fillStyle='rgba(255, 255, 255, 0.6)'; ctx.beginPath();
            f.forEach(p => { ctx.moveTo(p.x, p.y); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); });
            ctx.fill(); update(); requestAnimationFrame(draw);
        }
        function update() {
            f.forEach(p => { p.y += p.d; if(p.y > h) p.y = 0; p.x += Math.sin(p.y/30) * 0.3; });
        }
        window.onresize = init; init(); draw();
    </script>
</body>
</html>
