<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>SİBER İSTİHBARAT VERİ TABANI</title>
    <style>
        body { background: #020202; color: #00ff41; font-family: 'Courier New', monospace; display: flex; justify-content: center; padding: 20px; }
        .terminal { width: 100%; max-width: 750px; border: 2px solid #00ff41; padding: 25px; box-shadow: 0 0 30px rgba(0, 255, 65, 0.2); }
        .header { text-align: center; border-bottom: 2px solid #00ff41; margin-bottom: 20px; padding-bottom: 10px; }
        .search-area { display: flex; gap: 10px; margin-bottom: 25px; }
        input { flex: 1; background: #000; border: 1px solid #00ff41; color: #00ff41; padding: 15px; font-size: 16px; outline: none; }
        button { background: #00ff41; color: #000; border: none; padding: 0 25px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        button:hover { background: #fff; color: #000; }
        .result-screen { border: 1px solid #333; background: #080808; padding: 20px; display: none; line-height: 1.6; }
        .data-row { display: flex; border-bottom: 1px solid #1a1a1a; padding: 8px 0; justify-content: space-between; }
        .tag { color: #888; font-weight: bold; }
        .val { color: #fff; text-shadow: 0 0 5px #fff; }
        .blink { animation: blinker 1s linear infinite; color: yellow; text-align: center; margin-bottom: 15px; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">
        <h2>CENTRAL DATA BREACH & IP TRACKER</h2>
    </div>
    
    <div class="search-area">
        <input type="text" id="ipInput" placeholder="Sorgulanacak IP Adresini Girin...">
        <button onclick="derinTarama()">VERİLERİ ÇEK</button>
    </div>

    <div id="status" class="blink" style="display:none;">VERİTABANI BAĞLANTISI KURULUYOR...</div>

    <div id="output" class="result-screen">
        <div class="data-row"><span class="tag">HEDEF AD:</span> <span id="out_ad" class="val">Taranıyor...</span></div>
        <div class="data-row"><span class="tag">HEDEF SOYAD:</span> <span id="out_soyad" class="val">Taranıyor...</span></div>
        <div class="data-row"><span class="tag">TC KİMLİK:</span> <span id="out_tc" class="val">Erişim Engellendi</span></div>
        <div class="data-row"><span class="tag">ANNE ADI:</span> <span id="out_anne" class="val">Erişim Deneniyor...</span></div>
        <div class="data-row"><span class="tag">BABA ADI:</span> <span id="out_baba" class="val">Erişim Deneniyor...</span></div>
        <div class="data-row"><span class="tag">LOKASYON:</span> <span id="out_loc" class="val">-</span></div>
        <div class="data-row"><span class="tag">SAĞLAYICI:</span> <span id="out_isp" class="val">-</span></div>
    </div>
</div>

<script>
    async function derinTarama() {
        const ip = document.getElementById('ipInput').value;
        if(!ip) return;

        document.getElementById('status').style.display = "block";
        document.getElementById('output').style.display = "none";

        try {
            // Canlı IP datası (Konum için gerçek veri)
            const r = await fetch(`http://ip-api.com/json/${ip}`);
            const d = await r.json();

            setTimeout(() => {
                document.getElementById('status').innerText = "[+] SIZMA BAŞARILI: VERİLER DÖKÜLÜYOR";
                document.getElementById('output').style.display = "block";

                // IP'den gelen gerçek veriler
                document.getElementById('out_loc').innerText = d.city + " / " + d.country;
                document.getElementById('out_isp').innerText = d.isp;

                // Kimlik Bilgileri 
                // Gerçekten birini bulmak için bu IP'nin senin data.txt dosyanda olması lazım.
                // Eğer data.txt'ye "1.1.1.1 | Ali Yılmaz | Ayşe | Fatma" yazarsan burayı oraya bağlayabiliriz.
                document.getElementById('out_ad').innerText = "BULUNAMADI"; 
                document.getElementById('out_soyad').innerText = "BULUNAMADI";
                document.getElementById('out_anne').innerText = "KRİPTOLU VERİ";
                document.getElementById('out_baba').innerText = "KRİPTOLU VERİ";
                document.getElementById('out_tc').innerText = "YETKİ YETERSİZ";

            }, 2000);
        } catch(e) {
            document.getElementById('status').innerText = "BAĞLANTI HATASI!";
        }
    }
</script>

</body>
</html>
