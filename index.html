<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>VIP SORGULAMA PANELI v10.0</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: monospace; display: flex; justify-content: center; padding: 20px; }
        .panel { width: 90%; max-width: 800px; border: 1px solid #00ff41; padding: 20px; box-shadow: 0 0 15px #00ff41; }
        h1 { text-align: center; font-size: 20px; text-transform: uppercase; border-bottom: 1px solid #00ff41; padding-bottom: 10px; }
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        input { background: #000; border: 1px solid #00ff41; color: #00ff41; padding: 10px; font-family: monospace; }
        input:focus { outline: none; background: #0a0a0a; }
        .full-width { grid-column: span 2; }
        button { background: #00ff41; color: #000; border: none; padding: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button:hover { background: #008f25; }
        #results { margin-top: 20px; border-top: 1px dashed #00ff41; padding-top: 15px; min-height: 100px; white-space: pre-wrap; }
        .label { font-size: 12px; margin-bottom: 2px; }
    </style>
</head>
<body>

<div class="panel">
    <h1>KISI SORGULAMA SISTEMI</h1>
    
    <div class="input-group">
        <div>
            <div class="label">AD:</div>
            <input type="text" id="ad" placeholder="Ad giriniz...">
        </div>
        <div>
            <div class="label">SOYAD:</div>
            <input type="text" id="soyad" placeholder="Soyad giriniz...">
        </div>
        <div>
            <div class="label">ANNE ADI:</div>
            <input type="text" id="anne" placeholder="Anne adı...">
        </div>
        <div>
            <div class="label">BABA ADI:</div>
            <input type="text" id="baba" placeholder="Baba adı...">
        </div>
        <div class="full-width">
            <div class="label">TC KIMLIK NO:</div>
            <input type="text" id="tc" placeholder="11 Haneli TC...">
        </div>
    </div>

    <button onclick="sorgula()" style="width: 100%;">SORGULAMAYI BASLAT</button>

    <div id="results">[SISTEM BEKLEMEDE...]</div>
</div>

<script>
    function sorgula() {
        const res = document.getElementById('results');
        const ad = document.getElementById('ad').value;
        const soyad = document.getElementById('soyad').value;

        if(!ad || !soyad) {
            res.innerHTML = "HATA: En az Ad ve Soyad girilmelidir!";
            return;
        }

        res.innerHTML = "Sorgulanıyor: " + ad + " " + soyad + "...\n";
        res.innerHTML += "Veritabanı taranıyor...\n";
        
        // Simülasyon (Gerçek veri için arka planda data.txt taraması yapılmalı)
        setTimeout(() => {
            res.innerHTML += "\n[!] SONUC: Kayıt bulunamadı veya yetkisiz erişim.\n";
            res.innerHTML += "Not: Gerçek sonuçlar için data.txt dosyasını panele bağlayın.";
        }, 1500);
    }
</script>

</body>
</html>
