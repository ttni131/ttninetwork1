<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>SİBER SORGULAMA TERMİNALİ</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; display: flex; justify-content: center; padding: 20px; }
        .terminal { width: 100%; max-width: 700px; border: 1px solid #00ff41; padding: 20px; box-shadow: 0 0 20px #00ff41; }
        h1 { text-align: center; border-bottom: 2px solid #00ff41; padding-bottom: 10px; font-size: 1.2rem; }
        .input-area { display: flex; gap: 10px; margin: 20px 0; }
        input { flex: 1; background: #000; border: 1px solid #00ff41; color: #00ff41; padding: 12px; outline: none; }
        button { background: #00ff41; color: #000; border: none; padding: 0 20px; cursor: pointer; font-weight: bold; }
        .result-box { border: 1px dashed #333; padding: 15px; display: none; margin-top: 10px; }
        .row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #111; }
        .label { color: #888; font-size: 0.8rem; }
        .value { color: #00ff41; font-weight: bold; }
        .status { color: yellow; text-align: center; font-size: 0.9rem; margin: 10px 0; }
    </style>
</head>
<body>

<div class="terminal">
    <h1>[ CENTRAL IDENTITY DATABASE ]</h1>
    
    <div class="input-area">
        <input type="text" id="targetIp" placeholder="Hedef IP Adresini Yazınız...">
        <button onclick="sorgula()">SORGULA</button>
    </div>

    <div id="loading" class="status"></div>

    <div id="res" class="result-box">
        <div class="row"><span class="label">AD:</span> <span id="r_ad" class="value">-</span></div>
        <div class="row"><span class="label">SOYAD:</span> <span id="r_soyad" class="value">-</span></div>
        <div class="row"><span class="label">TC NO:</span> <span id="r_tc" class="value">-</span></div>
        <div class="row"><span class="label">ANNE ADI:</span> <span id="r_anne" class="value">-</span></div>
        <div class="row"><span class="label">BABA ADI:</span> <span id="r_baba" class="value">-</span></div>
        <div class="row"><span class="label">LOKASYON:</span> <span id="r_konum" class="value">-</span></div>
        <div class="row"><span class="label">OPERATÖR:</span> <span id="r_isp" class="value">-</span></div>
    </div>
</div>

<script>
    async function sorgula() {
        const ip = document.getElementById('targetIp').value;
        const loader = document.getElementById('loading');
        const box = document.getElementById('res');

        if(!ip) return;

        loader.innerText = "Sistem Sorgulanıyor... Veritabanına Erişiliyor...";
        box.style.display = "none";

        try {
            // Canlı IP verisi çekme (Konum ve Operatör için)
            const resp = await fetch(`http://ip-api.com/json/${ip}`);
            const data = await resp.json();

            setTimeout(() => {
                loader.innerText = "[+] KAYIT BULUNDU!";
                box.style.display = "block";

                // IP'den Gelen Gerçek Veriler
                document.getElementById('r_konum').innerText = data.city + " / " + data.country;
                document.getElementById('r_isp').innerText = data.isp;

                // Veritabanı Eşleşmesi (Bu kısım senin listenle dolacak)
                // Şimdilik sistemin nasıl görüneceğini göstermek için örnek dolduruyorum:
                document.getElementById('r_ad').innerText = "Sorgulanan"; 
                document.getElementById('r_soyad').innerText = "Kullanıcı";
                document.getElementById('r_tc').innerText = "382********";
                document.getElementById('r_anne').innerText = "Emine";
                document.getElementById('r_baba').innerText = "Mehmet";

            }, 1500);
        } catch(e) {
            loader.innerText = "Bağlantı Hatası!";
        }
    }
</script>

</body>
</html>
