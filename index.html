<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTNI Gamer Zone | Sinop</title>
    <style>
        :root {
            --primary: #00ffcc;
            --bg: #0a0a0c;
            --card-bg: #16161a;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: linear-gradient(to bottom, #111, transparent);
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 0 15px var(--primary);
        }

        .hero {
            margin-top: 50px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--primary);
            text-shadow: 2px 2px 10px rgba(0, 255, 204, 0.5);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1200px;
            margin-top: 50px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #333;
            padding: 20px;
            border-radius: 10px;
            transition: 0.3s;
            cursor: pointer;
            text-align: center;
        }

        .card:hover {
            border-color: var(--primary);
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 255, 204, 0.2);
        }

        .btn {
            background: var(--primary);
            color: black;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 15px;
            cursor: pointer;
        }

        footer {
            margin-top: 100px;
            padding: 20px;
            color: #555;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <h2>TTNI NETWORK</h2>
    </header>

    <div class="hero">
        <h1>LEVEL UP YOUR GAME</h1>
        <p>Sinop'un Dijital Dünyasına Hoş Geldin.</p>
    </div>

    <div class="container">
        <div class="card">
            <h3>PRO TURNUVALAR</h3>
            <p>En iyi oyuncularla kapışmaya hazır mısın?</p>
            <button class="btn">KATIL</button>
        </div>
        <div class="card">
            <h3>EKİPMANLAR</h3>
            <p>Hızını ve performansını ikiye katla.</p>
            <button class="btn">İNCELE</button>
        </div>
        <div class="card">
            <h3>TOPLULUK</h3>
            <p>Discord üzerinden ekibini kur.</p>
            <button class="btn">BAĞLAN</button>
        </div>
    </div>

    <footer>
        &copy; 2026 TTNI Network - Sinop Teknopark Projesidir.
    </footer>

</body>
</html>
